; To reset every value to its default, delete this file before starting
[Graphics]
; Enable or disable the orbital trails of the bodies (True/False)
trails_enabled = True

; Heatmap shown at startup. Valid values: off, phi_mode, dphi_dt_mode, tidal_mode
starting_heatmap_mode = phi_mode

; Visual sensitivity of the Roche distortion, and global contrast
roche_sensitivity_mag = 0.0
roche_contrast = 15.0

; Manual offset for the user visual sensitivity
user_sensitivity_mag = 0.0

; Maximum rendering framerate
target_fps = 60

[Simulation]
; Initial radius of the simulated universe (in Astronomical Units)
; WARNING: this value is used EXCLUSIVELY by the 'Empty Scenario' preset.
; For every other scenario the radius is set automatically.
simulation_radius_au = 64.0
